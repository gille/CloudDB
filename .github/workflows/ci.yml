name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.0' # Matching go.mod version roughly (1.24.4 isn't out yet, assuming 1.24.x)
        check-latest: true

    - name: Test Go
      run: go test -v ./...

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'admin-ui/package-lock.json'
      if: hashFiles('admin-ui/package.json') != ''

    - name: Install Frontend Dependencies
      if: hashFiles('admin-ui/package.json') != ''
      working-directory: admin-ui
      run: npm ci

    - name: Test Frontend
      if: hashFiles('admin-ui/package.json') != ''
      working-directory: admin-ui
      run: npm run test
